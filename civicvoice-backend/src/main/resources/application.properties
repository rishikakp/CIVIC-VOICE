# ---------------------------------------------------------------------------
# Civic Voice - Spring Boot Backend Configuration
# ---------------------------------------------------------------------------

# PostgreSQL Database
# Defaults to local dev; override with DB_URL / DB_USER / DB_PASSWORD for cloud/container deploys
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/civic_voice}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Server
# Render injects a PORT env var; default to 8080 for local dev
server.port=${PORT:8080}
server.error.include-message=always

# Application settings
app.upload-dir=${APP_UPLOAD_DIR:uploads}
# Comma separated list of admin emails. Override via environment variable ADMIN_EMAILS.
app.admin-emails=${ADMIN_EMAILS:admin@civicvoice.local,priya@civicvoice.local}

# JSON serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------------------------------------------------------------------
# Clerk authentication
# ---------------------------------------------------------------------------
# Publishable key (public) - derive issuer + JWKS URL for JWT verification.
app.clerk.publishable-key=${CLERK_PUBLISHABLE_KEY:}
# Secret key (private!) - used server-side to resolve a Clerk user id to an
# email/profile via https://api.clerk.com/v1/users/{id}. Keep it in .env only.
app.clerk.secret-key=${CLERK_SECRET_KEY:}

# Long-lived Civic Voice session token (HS256). If empty, a random secret is
# generated once and persisted to ./session.secret (gitignored).
app.session.secret=${APP_SESSION_SECRET:}
# Session lifetime in hours (default 7 days)
app.session-ttl-hours=${APP_SESSION_TTL_HOURS:168}
