# ---------------------------------------------------------------------------
# Civic Voice - Spring Boot Backend Configuration
# ---------------------------------------------------------------------------

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/civic_voice
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Server
server.port=8080
server.error.include-message=always

# Application settings
app.upload-dir=uploads
# Comma separated list of admin emails. Override via environment variable ADMIN_EMAILS.
app.admin-emails=${ADMIN_EMAILS:admin@civicvoice.local,priya@civicvoice.local}

# JSON serialization
spring.jackson.serialization.write-dates-as-timestamps=false
