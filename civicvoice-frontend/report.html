<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report an issue — Civic Voice</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-50 min-h-screen">
  <div id="topbar"></div>
  <main class="mx-auto max-w-xl px-4 py-10">
    <h1 class="text-3xl font-bold">Report an issue</h1>
    <p class="mt-1 text-sm text-zinc-500">Upload a photo, add details, and submit. Done in under a minute.</p>

    <div id="gate" class="mt-8"></div>

    <form id="form" class="mt-6 rounded-2xl border border-zinc-200 bg-white p-6 shadow-sm space-y-4 hidden">
      <div>
        <label class="block text-sm font-medium mb-1">Photo</label>
        <input id="r-image" type="file" accept="image/*" class="block w-full text-sm text-zinc-600 file:mr-3 file:rounded-lg file:border-0 file:bg-blue-50 file:px-4 file:py-2 file:text-sm file:font-medium file:text-blue-700 hover:file:bg-blue-100">
        <div class="mt-2"><button type="button" onclick="useLocation()" class="text-xs text-blue-600 hover:underline">📍 Use my GPS location</button></div>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Description</label>
        <textarea id="r-desc" rows="3" required placeholder="What's the problem? Be specific." class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium mb-1">Category</label>
          <select id="r-type" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm">
            <option>Roads</option><option>Streetlights</option><option>Sanitation</option><option>Water</option>
            <option>Utilities</option><option>Footpaths</option><option>Traffic</option><option>Environment</option>
            <option>Other</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Severity</label>
          <select id="r-severity" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm">
            <option>LOW</option><option>MEDIUM</option><option selected>HIGH</option><option>CRITICAL</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Location name</label>
        <input id="r-locationName" placeholder="e.g. Marathahalli, Bengaluru" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <input id="r-latlon" type="hidden">
      <button id="btn-submit" class="w-full rounded-lg bg-blue-600 px-3 py-2.5 text-sm font-semibold text-white hover:bg-blue-700">Submit report</button>
    </form>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    function useLocation() {
      if (!navigator.geolocation) return toast('Geolocation not supported', false);
      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude.toFixed(5);
        const lon = pos.coords.longitude.toFixed(5);
        document.getElementById('r-latlon').value = lat + ',' + lon;
        const n = document.getElementById('r-locationName');
        if (!n.value) n.value = lat + ',' + lon;
        toast('Location captured ✔');
      }, () => toast('Could not get location', false));
    }

    document.addEventListener('DOMContentLoaded', () => {
      const gate = document.getElementById('gate');
      const user = getCurrentUser();
      if (!user) {
        gate.innerHTML = '<div class="rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">Please <a href="login.html" class="font-semibold underline">sign in</a> to report an issue.</div>';
        return;
      }
      document.getElementById('form').classList.remove('hidden');
      document.getElementById('btn-submit').onclick = async (e) => {
        e.preventDefault();
        const fd = new FormData();
        fd.append('description', document.getElementById('r-desc').value.trim());
        fd.append('issueType', document.getElementById('r-type').value);
        fd.append('severity', document.getElementById('r-severity').value);
        fd.append('locationName', document.getElementById('r-locationName').value.trim());
        fd.append('coordinates', document.getElementById('r-latlon').value);
        fd.append('email', user.email);
        const img = document.getElementById('r-image').files[0];
        if (img) fd.append('image', img);
        try {
          await Civic.createIssue(fd);
          toast('Report submitted ✔');
          setTimeout(() => location.href = 'my.html', 800);
        } catch (err) { toast(err.message, false); }
      };
    });
  </script>
</body>
</html>
