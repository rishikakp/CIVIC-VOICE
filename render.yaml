# Civic Voice - Render Blueprint (one-click deploy on render.com)
# Provisions: PostgreSQL + backend web service + static frontend.

services:
  - type: web
    name: civicvoice-backend
    runtime: docker
    repo: https://github.com/rishikakp/CIVIC-VOICE.git
    dockerfilePath: civicvoice-backend/Dockerfile
    healthCheckPath: /api/issues?page=1
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: civicvoice-db
          property: connectionString
      - key: ADMIN_EMAILS
        value: admin@civicvoice.local
      - key: APP_UPLOAD_DIR
        value: /app/uploads

  - type: web
    name: civicvoice-frontend
    runtime: static
    buildCommand: echo "static site"
    staticPublishPath: civicvoice-frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: civicvoice-db
    plan: free
    databaseName: civic_voice
